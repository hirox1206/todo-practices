<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TypeScript ToDo</title>
    <script src="dist/main.js" type="module"></script>
  </head>
  <body>
    <div class="todo-app">
      <div class="todo-app__list"></div>
      <div class="todo-app__input-wrapper">
        <input type="text" class="todo-app__input" />
        <button type="button" class="todo-app__add-button">追加</button>
        <button type="button" class="todo-app__remove-button">
          選択した項目の削除
        </button>
      </div>
    </div>
  </body>
</html>
